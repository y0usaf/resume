<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sami Ansari · Résumé</title>
  <style>
    @font-face { font-family: "Crimson Pro"; src: url("assets/CrimsonPro-Regular.otf") format("opentype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Crimson Pro"; src: url("assets/CrimsonPro-Italic.otf") format("opentype"); font-weight: 400; font-style: italic; font-display: block; }
    @font-face { font-family: "Crimson Pro"; src: url("assets/CrimsonPro-SemiBold.otf") format("opentype"); font-weight: 600; font-display: block; }
    :root { --ink: #111; --body: #222; --muted: #666; --rule: #161616; --highlight: #fbe27a; --serif: "Crimson Pro", Georgia, serif; --indent: 0.16in; --icon: 14px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: radial-gradient(circle, rgb(0 0 0 / 12%) 1.4px, transparent 1.5px) 0 0 / 22px 22px, #ececec; }
    body { padding: 32px 16px; color: var(--body); font: 11pt/1.23 var(--serif); font-variant-numeric: lining-nums; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    main { width: 8.5in; min-height: 11in; margin: 0 auto; padding: 0.42in 0.6in 0.3in; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 12%), 0 14px 36px rgb(0 0 0 / 10%); }
    a { color: inherit; text-decoration: none; }
    header { text-align: center; }
    h1 { display: inline-block; color: var(--ink); font-size: 2.364em; font-weight: 600; line-height: 1.05; padding: 0 0.35in 3pt; border-bottom: 2pt solid var(--rule); }
    .contact { margin-top: 5pt; font-size: 0.909em; color: var(--muted); }
    .contact a { color: var(--body); }
    .contact a, .contact span { white-space: nowrap; }
    .sep { margin: 0 0.45em; color: #b5b5b5; }
    section { margin-top: 9pt; }
    h2 { margin: 0 0 4pt; color: var(--ink); font-size: 1.273em; font-weight: 600; line-height: 1.15; text-decoration: underline 1pt; text-underline-offset: 2.5pt; }
    .entry, .project { position: relative; padding-left: calc(var(--indent) + var(--icon) + 5px); }
    .entry + .entry { margin-top: 5pt; }
    .project + .project { margin-top: 3.5pt; }
    .head { display: flex; align-items: baseline; gap: 0.3em; }
    h3 { color: var(--ink); font-size: 1.091em; font-weight: 600; line-height: 1.2; }
    .role { color: var(--body); font-style: italic; }
    ul + .head { margin-top: 2pt; }
    h3 + .role { margin-left: 0.3em; }
    time, .stack { margin-left: auto; color: var(--muted); white-space: nowrap; font-size: 0.909em; }
    .logo, .mark { position: absolute; left: var(--indent); top: 2pt; width: var(--icon); height: var(--icon); }
    .logo { object-fit: contain; }
    .mark { padding: 1px; fill: var(--ink); }
    h3 a { color: var(--ink); }
    ul { margin-top: 1.5pt; padding-left: 13px; list-style: none; }
    li { position: relative; padding-left: 13px; }
    li + li { margin-top: 0.8pt; }
    li::before { content: ""; position: absolute; left: 0; top: 0.5em; width: 4px; height: 4px; background: var(--ink); }
    strong { font-weight: 600; color: var(--ink); background: var(--highlight); padding: 0 1.5pt; margin: 0 -1.5pt; border-radius: 1.5pt; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .project p, .detail { padding-left: 26px; }
    .detail { color: var(--muted); }
    .skills { display: grid; grid-template-columns: max-content 1fr; column-gap: 0.7em; row-gap: 0.5pt; padding-left: calc(var(--indent) + var(--icon) + 5px); }
    dt { color: var(--ink); font-weight: 600; }
    @page { size: letter; margin: 0.4in 0.5in 0.3in; }
    @media print { html, body { background: #fff; padding: 0; font-size: 10.2pt; } main { width: auto; min-height: 0; padding: 0; box-shadow: none; } }
    @media screen and (max-width: 8.6in) { body { padding: 0; } main { width: auto; min-height: 0; padding: 24px; box-shadow: none; } .head { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <main>
{{resume}}
  </main>
</body>
</html>
